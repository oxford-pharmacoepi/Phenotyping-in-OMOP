name: Quarto Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website

      - name: Install LaTeX (TinyTeX)
        uses: r-lib/actions/setup-tinytex@v2

      - name: Download mock datasets
        shell: Rscript {0}
        run: |
          source('Databases/createDatabases.R')

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book in pdf
        run: |
          quarto render --to pdf --output phenotyping-in-omop.pdf

      - name: Move pdf outside _site folder
        run: |
          mv "_site/phenotyping-in-omop.pdf" "phenotyping-in-omop.pdf"

      - name: Render book in html
        run: |
          quarto render --to html

      - name: Move pdf back to _site folder
        run: |
          mv "phenotyping-in-omop.pdf" "_site/phenotyping-in-omop.pdf"

      # For PRs, just render (no publishing)
      - name: Exit if PR
        if: github.event_name == 'pull_request'
        run: exit 0

      # Publish HTML and pdf from _site to GitHub Pages
      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
